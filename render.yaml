services:
  - type: web
    name: my-ai-studio
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_DATA_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
    disk:
      name: my-ai-studio-data
      mountPath: /var/data
      sizeGB: 20